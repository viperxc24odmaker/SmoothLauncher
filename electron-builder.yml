appId: com.makeforge.launcher
productName: MakeForge Launcher
artifactName: MakeForge-Launcher-setup-${version}.${ext}

directories:
  buildResources: build
  output: dist

publish:
  provider: generic
  url: ""

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

files:
  - "**/*"
  - "!docs${/*}"
  - "!dev-app-update.yml"
