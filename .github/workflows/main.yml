name: Build Windows

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        run: npm run dist:win

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: MakeForge-Launcher-Windows
          path: dist/*.exe
